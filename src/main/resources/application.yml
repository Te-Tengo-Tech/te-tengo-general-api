spring:
  application:
    name: te-tengo-general-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clave pública RS256 de los tokens. En local: scripts/generar-claves.sh
          public-key-location: ${TT_JWT_CLAVE_PUBLICA:file:.claves/publica.pem}

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
