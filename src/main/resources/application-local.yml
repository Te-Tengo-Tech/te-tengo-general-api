# Profile `local`, the default of `./gradlew bootRun`: the AWS services run on Floci, the local AWS
# emulator of compose.yaml, at http://localhost:4566 (ADR 0005); TT_FLOCI_PUERTO moves it, as it
# moves the published port in compose.yaml (scripts/e2e.sh). The keys are Floci's built-in
# test/test pair: compose.yaml turns on signature verification, which only accepts known keys.
tetengo:
  cors:
    # A PWA served locally (flutter run -d chrome, any port) may call the API.
    origenes: ${TT_CORS_ORIGENES:http://localhost:*,http://127.0.0.1:*}
  clips:
    # The pre-signed URLs point to http://localhost:4566, reachable from the household agent on this
    # machine and from the iOS simulator.
    s3:
      bucket: te-tengo-clips
      region: us-east-1
      endpoint: http://localhost:${TT_FLOCI_PUERTO:4566}
      path-style: true
      access-key: test
      secret-key: test
      crear-bucket: true
  correo:
    # E-mails go to Floci's SES: read them at http://localhost:4566/_aws/ses (TT_CORREO_PROVEEDOR=registro
    # only logs them instead).
    proveedor: ${TT_CORREO_PROVEEDOR:ses}
    ses:
      remitente: Te Tengo <no-responder@tetengo.test>
      region: us-east-1
      endpoint: http://localhost:${TT_FLOCI_PUERTO:4566}
      access-key: test
      secret-key: test
  push:
    # Pushes go to Floci's SNS, which captures them at http://localhost:4566/_aws/sns/push-notifications
    # (nothing reaches a phone). TT_PUSH_PROVEEDOR=simulador shows them on the booted iOS simulator,
    # fcm sends them to real phones through Firebase, registro only logs. docs/NOTIFICATIONS.md
    proveedor: ${TT_PUSH_PROVEEDOR:sns}
    sns:
      region: us-east-1
      endpoint: http://localhost:${TT_FLOCI_PUERTO:4566}
      access-key: test
      secret-key: test
      # Creates te-tengo-android, te-tengo-ios and te-tengo-web (FCM applications) on Floci.
      crear-aplicaciones: true
  vista-en-vivo:
    # Same default as the MediaMTX service of compose.yaml (its auth hook calls this API on the host).
    secreto-autorizacion: ${TT_VIVO_SECRETO_AUTORIZACION:secreto-local-de-vista-en-vivo}
