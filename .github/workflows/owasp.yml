name: OWASP Dependency-Check

# Weekly CVE scan of the runtime dependencies against the NVD. It is kept out of the pull request CI
# on purpose: the NVD download is slow and rate limited, and must not make PR checks flaky.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/owasp.yml

permissions:
  contents: read

concurrency:
  group: owasp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for the NVD API key
        id: key
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::notice title=OWASP Dependency-Check skipped::Add the NVD_API_KEY repository secret (free key: https://nvd.nist.gov/developers/request-an-api-key) to run the scan. Without it the NVD download is rate limited and takes hours. The OSV-Scanner workflow still covers the Gradle dependencies."
            echo "### OWASP Dependency-Check skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The \`NVD_API_KEY\` secret is not set. OSV-Scanner (\`osv-scanner.yml\`) still scans the dependencies." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.key.outputs.present == 'true'
      - name: Cache the NVD database
        if: steps.key.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Run OWASP Dependency-Check (fails on CVSS >= 7.0)
        if: steps.key.outputs.present == 'true'
        run: ./gradlew dependencyCheckAnalyze
      - name: Upload report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: |
            build/reports/dependency-check-report.html
            build/reports/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 30
