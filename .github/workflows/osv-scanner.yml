name: OSV-Scanner

# Scans the resolved Gradle dependencies (all configurations) against the OSV database
# (GitHub Advisory Database, Maven advisories and more). It does not need an API key.
# Scheduled and manual runs fail on high or critical findings; pull request runs only report.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - .github/workflows/osv-scanner.yml
      - .github/scripts/osv_summary.py
      - .github/scripts/gradle-lockfile.init.gradle

permissions:
  contents: read

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Resolve dependencies into gradle.lockfile
        run: ./gradlew --init-script .github/scripts/gradle-lockfile.init.gradle dependencies --write-locks --quiet > /dev/null
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true # exits non-zero when it finds vulnerabilities; the next step decides
        with:
          scan-args: |-
            --lockfile=gradle.lockfile
            --format=json
            --output-file=osv-results.json
      - name: Summary and gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          gate=()
          if [ "$EVENT" != pull_request ]; then gate=(--fail-on-high); fi
          python3 .github/scripts/osv_summary.py osv-results.json "${gate[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-report
          path: |
            osv-results.json
            gradle.lockfile
          if-no-files-found: warn
          retention-days: 30
