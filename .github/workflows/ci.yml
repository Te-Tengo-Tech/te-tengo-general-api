name: CI

# Unit, integration and architecture tests, format, the executable jar and the coverage gate. Each commit is
# tested once (docs/DEPLOYMENT.md):
#   - pull requests into develop (or into a release branch): everything;
#   - push to develop: everything on the merged commit (it also refreshes the caches pull requests read);
#   - release/x.y.z and hotfix/x.y.z: release.yml calls this workflow (workflow_call) on the candidate's
#     commit, next to the image build; no candidate is recorded unless it passes;
#   - pull requests into main (release and hotfix): no test runs again. Their head is that tested commit and
#     release-gate.yml proves it; only `ci-ok` runs.
# `ci-ok` is the single required check of the rulesets: it fails unless every job it needs passed.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1) Fast lane: unit tests, no Docker and no Spring context.
  unit:
    name: Unit tests
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only develop writes the Gradle cache; pull requests and release runs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Run unit tests
        run: ./gradlew unitTest
      - name: Test summary
        if: always()
        run: python3 .github/scripts/ci_summary.py junit "Unit tests" build/test-results/unitTest >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-unit
          path: build/jacoco/unitTest.exec
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: build/reports/tests/
          retention-days: 7

  # 2) Integration tests against PostgreSQL in Testcontainers (Docker is available on ubuntu-latest).
  integration:
    name: Integration tests
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only develop writes the Gradle cache; pull requests and release runs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Run integration tests
        run: ./gradlew integrationTest
      - name: Test summary
        if: always()
        run: python3 .github/scripts/ci_summary.py junit "Integration tests" build/test-results/integrationTest >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-integration
          path: build/jacoco/integrationTest.exec
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports
          path: build/reports/tests/
          retention-days: 7

  # 3) Verify: formatting, architecture rules (ArchUnit and Spring Modulith) and the executable jar.
  verify:
    name: Format, architecture and build
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only develop writes the Gradle cache; pull requests and release runs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Format
        run: ./gradlew spotlessCheck
      - name: Architecture tests
        run: ./gradlew architectureTest
      - name: Test summary
        if: always()
        run: python3 .github/scripts/ci_summary.py junit "Architecture tests" build/test-results/architectureTest >> "$GITHUB_STEP_SUMMARY"
      - name: Build the executable jar
        run: ./gradlew bootJar
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture-test-reports
          path: build/reports/tests/
          retention-days: 7

  # 4) Coverage of unit + integration tests together, and the 80 % gate on domain and application.
  coverage:
    name: Coverage
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only develop writes the Gradle cache; pull requests and release runs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jacoco-*
          path: build/jacoco
          merge-multiple: true
      - name: Coverage report and gate (80 % of lines in domain and application)
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification
      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/ci_summary.py jacoco "Coverage (unit + integration)" build/reports/jacoco/test/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/reports/jacoco/test/
          retention-days: 14

  # The single required check (rulesets of develop and main). It always runs, so a skipped or cancelled
  # job can never pass for a green one.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [unit, integration, verify, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every CI job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if [ "$RELEASE_PR" = true ]; then
            # Pull requests into main carry an already tested candidate; release-gate.yml checks it.
            if [[ ! "$HEAD_REF" =~ ^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Not a release branch::Only release/x.y.z and hotfix/x.y.z are merged into main; open the pull request from $HEAD_REF against develop."
              exit 1
            fi
            echo "Release pull request from $HEAD_REF: its candidate's commit was tested by release.yml; release-gate decides."
            exit 0
          fi
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"] | join(", ")' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error title=CI failed::Not passed: $failed."
            exit 1
          fi
          echo "Every CI job passed."
