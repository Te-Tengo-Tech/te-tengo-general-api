name: CI

on:
  push:
    # release/* and hotfix/* too: the release pull request to main is opened by the Release workflow with
    # GITHUB_TOKEN, which starts no pull_request run, so its required checks come from these pushes.
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Fast lane: unit tests, no Docker and no Spring context.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests
        run: ./gradlew unitTest
      - name: Test summary
        if: always()
        run: python3 .github/scripts/ci_summary.py junit "Unit tests" build/test-results/unitTest >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-unit
          path: build/jacoco/unitTest.exec
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: build/reports/tests/
          retention-days: 7

  # 2) Integration tests against PostgreSQL in Testcontainers (Docker is available on ubuntu-latest).
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run integration tests
        run: ./gradlew integrationTest
      - name: Test summary
        if: always()
        run: python3 .github/scripts/ci_summary.py junit "Integration tests" build/test-results/integrationTest >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-integration
          path: build/jacoco/integrationTest.exec
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: build/reports/tests/
          retention-days: 7

  # 3) Verify: formatting, architecture rules (ArchUnit and Spring Modulith) and the executable jar.
  verify:
    name: Format, architecture and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Format
        run: ./gradlew spotlessCheck
      - name: Architecture tests
        run: ./gradlew architectureTest
      - name: Test summary
        if: always()
        run: python3 .github/scripts/ci_summary.py junit "Architecture tests" build/test-results/architectureTest >> "$GITHUB_STEP_SUMMARY"
      - name: Build the executable jar
        run: ./gradlew bootJar
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-test-reports
          path: build/reports/tests/
          retention-days: 7

  # 4) Coverage of unit + integration tests together, and the 80 % gate on domain and application.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: jacoco-*
          path: build/jacoco
          merge-multiple: true
      - name: Coverage report and gate (80 % of lines in domain and application)
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification
      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/ci_summary.py jacoco "Coverage (unit + integration)" build/reports/jacoco/test/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/
          retention-days: 14
