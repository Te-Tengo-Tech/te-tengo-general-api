name: Produccion
run-name: Produccion (main, ${{ github.sha }})

# Production of the API, on a push to main (the merged release or hotfix pull request): docs/DEPLOYMENT.md.
# Nothing is built here: production gets the exact image that release.yml built and verified on the
# release branch, by digest.
#   1. candidate    finds the approved candidate: the newest pre-release vX.Y.Z-rc.N (X.Y.Z = version of
#                   build.gradle.kts) whose recorded git tree hash equals main's (`git rev-parse HEAD^{tree}`)
#                   and whose verification passed. None → the run fails: main differs from what was tested.
#   2. produccion   sends repository_dispatch `desplegar-api` to te-tengo-infra with the candidate's digest
#                   and waits for that Deploy run (.github/scripts/request-deploy.sh). The approval happens
#                   there, on te-tengo-infra's `produccion` environment, which also takes a database backup
#                   before the image changes. Switch: ENABLE_API_DEPLOY.
#   3. release      only if every enabled production job succeeded: adds the tags X.Y.Z (and `latest`, which
#                   always names the image in production, only after a deploy) to the same digest with
#                   `docker buildx imagetools create` (no rebuild), then creates the tag vX.Y.Z on this commit
#                   and its GitHub Release (notes: the CHANGELOG.md section and the candidate).
#   4. back-merge   opens the pull request main → develop (`chore: merge release x.y.z back into develop`).
# If produccion fails there is no tag: fix it and use "Re-run failed jobs", which reuses the same candidate.
# Rollback: rollback.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Shared with rollback.yml: one production change of the API at a time, never cancelled.
concurrency:
  group: produccion
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/te-tengo-tech/te-tengo-general-api

jobs:
  candidate:
    name: Find the verified candidate of main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.find.outputs.released }}
      candidate: ${{ steps.find.outputs.candidate }}
      build: ${{ steps.find.outputs.build }}
      commit: ${{ steps.find.outputs.commit }}
      tree: ${{ steps.find.outputs.tree }}
      digest: ${{ steps.find.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::build.gradle.kts must declare version = \"x.y.z\" (found '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Candidate whose tree hash equals main's
        id: find
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          # Already released from this commit (a full re-run of a successful run): nothing left to do.
          if released=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.sha' 2>/dev/null); then
            if [ "$released" = "$GITHUB_SHA" ]; then
              echo "released=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Already released::v$VERSION already tags $GITHUB_SHA: nothing to deploy or tag."
              echo "\`v$VERSION\` already tags this commit: nothing to deploy or tag." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error title=Version already released::v$VERSION already exists on another commit ($released). A new release needs a new version: release/x.y.z or hotfix/x.y.z with a higher version in build.gradle.kts."
            exit 1
          fi
          field() { sed -n "s/^$1=//p" "$notes" | head -n 1; }
          notes="$RUNNER_TEMP/notes.md"
          numbers=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION-rc." --jq '.[].ref' \
            | sed -n "s|^refs/tags/v$VERSION-rc\.\([0-9][0-9]*\)$|\1|p" | sort -rn)
          for n in $numbers; do
            gh release view "v$VERSION-rc.$n" -R "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null | tr -d '\r' > "$notes" || continue
            [ "$(field tree)" = "$tree" ] || continue
            if [ "$(field verification)" != passed ]; then
              echo "::warning::v$VERSION-rc.$n has main's tree but its verification is '$(field verification)'; looking at older candidates."
              continue
            fi
            digest=$(field digest)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::v$VERSION-rc.$n records no valid digest"; exit 1; }
            {
              echo "released=false"
              echo "candidate=$(field candidate)"
              echo "build=$(field build)"
              echo "commit=$(field commit)"
              echo "tree=$tree"
              echo "digest=$digest"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Candidate $(field candidate)"
              echo "\`main\` (\`$GITHUB_SHA\`) has the tree \`$tree\` of the verified candidate [\`v$VERSION-rc.$n\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION-rc.$n) (commit \`$(field commit)\`, build $(field build))."
              echo "Image: \`$IMAGE@$digest\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done
          message="main differs from the tested candidate; push the change to the release branch to build a new rc."
          message+=" No verified pre-release v$VERSION-rc.N has the tree $tree of $GITHUB_SHA."
          echo "::error title=No candidate for main::$message"
          echo "**No candidate:** $message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  produccion:
    name: Produccion (deploy through te-tengo-infra, approval there)
    needs: candidate
    # Switch: ENABLE_API_DEPLOY (te-tengo-infra gates its deploy job with the same variable).
    if: needs.candidate.outputs.released != 'true' && vars.ENABLE_API_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Includes the wait for a reviewer in te-tengo-infra. If it runs out, "Re-run failed jobs" watches the
    # same infra run again instead of requesting a second deploy.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    outputs:
      infra_run: ${{ steps.deploy.outputs.infra_run }}
    env:
      DIGEST: ${{ needs.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check that the candidate image exists
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null \
            || { echo "::error::$IMAGE@$DIGEST is not in GHCR"; exit 1; }
      - name: Request the deploy and wait for its result
        id: deploy
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TAG: ${{ needs.candidate.outputs.candidate }}
          VERSION: ${{ needs.candidate.outputs.version }}
          REF: ${{ github.sha }}
          KIND: release
        run: .github/scripts/request-deploy.sh

  release:
    name: Tag the image and create the release vX.Y.Z
    needs: [candidate, produccion]
    # Only when every enabled production job succeeded (a produccion skipped by its switch counts as done).
    if: >-
      !cancelled()
      && needs.candidate.result == 'success'
      && needs.candidate.outputs.released != 'true'
      && (needs.produccion.result == 'success'
          || (needs.produccion.result == 'skipped' && vars.ENABLE_API_DEPLOY != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.candidate.outputs.version }}
      CANDIDATE: ${{ needs.candidate.outputs.candidate }}
      BUILD: ${{ needs.candidate.outputs.build }}
      COMMIT: ${{ needs.candidate.outputs.commit }}
      TREE: ${{ needs.candidate.outputs.tree }}
      DIGEST: ${{ needs.candidate.outputs.digest }}
      DEPLOYED: ${{ needs.produccion.result == 'success' }}
      INFRA_RUN: ${{ needs.produccion.outputs.infra_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the tags ${{ needs.candidate.outputs.version }}${{ needs.produccion.result == 'success' && ' and latest' || '' }} to the candidate digest
        run: |
          set -euo pipefail
          # X.Y.Z is immutable (SemVer): it may only ever point to this digest.
          if existing=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest'); then
            [ "$existing" = "$DIGEST" ] || { echo "::error::$IMAGE:$VERSION already points to $existing, not to $DIGEST"; exit 1; }
          fi
          tags=(--tag "$IMAGE:$VERSION")
          [ "$DEPLOYED" = true ] && tags+=(--tag "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r '.digest')
          [ "$tagged" = "$DIGEST" ] || { echo "::error::$IMAGE:$VERSION has digest $tagged, not $DIGEST"; exit 1; }
          {
            echo "## Release $VERSION"
            if [ "$DEPLOYED" = true ]; then
              echo "Tagged \`$IMAGE@$DIGEST\` (candidate \`$CANDIDATE\`, deployed by $INFRA_RUN) as \`$VERSION\` and \`latest\`."
            else
              echo "Tagged \`$IMAGE@$DIGEST\` (candidate \`$CANDIDATE\`) as \`$VERSION\`."
              echo "**Not deployed:** the organization variable \`ENABLE_API_DEPLOY\` is not \`true\`, so production still runs the previous image and \`latest\` was not moved."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the tag and the GitHub Release v${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="$RUNNER_TEMP/notes.md"
          # The CHANGELOG.md section "## [x.y.z] ..." up to the next "## [" heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::warning::CHANGELOG.md has no section [$VERSION]; the release notes point to the file."
            echo "See [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md)." > "$notes"
          fi
          if [ "$DEPLOYED" = true ]; then
            tags="\`$VERSION\`, \`latest\`"
            deployed="deployed to produccion by $INFRA_RUN"
          else
            tags="\`$VERSION\`"
            deployed="not deployed (\`ENABLE_API_DEPLOY\` was off)"
          fi
          cat >> "$notes" <<EOF

          ### Image
          Candidate [\`v$CANDIDATE\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$CANDIDATE) (build $BUILD), promoted without a rebuild: \`$IMAGE@$DIGEST\`, tags $tags, linux/amd64 and linux/arm64; $deployed.

          \`\`\`text
          version=$VERSION
          candidate=$CANDIDATE
          build=$BUILD
          commit=$GITHUB_SHA
          candidate_commit=$COMMIT
          tree=$TREE
          image=$IMAGE
          digest=$DIGEST
          \`\`\`
          EOF
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --latest --notes-file "$notes"
          echo "Created the tag \`$tag\` on \`$GITHUB_SHA\` and its GitHub Release." >> "$GITHUB_STEP_SUMMARY"

  back-merge:
    name: Open the back-merge pull request (main → develop)
    needs: [candidate, release]
    if: >-
      !cancelled()
      && (needs.release.result == 'success' || needs.candidate.outputs.released == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - name: Open the pull request if develop lacks commits of main
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...main" --jq '.ahead_by')
          if [ "$ahead" = 0 ]; then
            echo "develop already has every commit of main: no back-merge needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          number=$(gh pr list -R "$GITHUB_REPOSITORY" --head main --base develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "The back-merge pull request #$number is already open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr create -R "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: merge release $VERSION back into develop" \
            --body "Brings the release $VERSION (tag \`v$VERSION\`) and any fix made on its release branch back into \`develop\`. Merge with a merge commit.")
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
